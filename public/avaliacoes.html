<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliações — Agendilha</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #fff;
      color: #333;
      margin: 0;
      padding: 20px;
    }
    section {
      max-width: 600px;
      margin: auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      padding: 20px;
    }
    h2 {
      color: #006633;
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }
    .avaliacao {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #eee;
      position: relative;
    }
    .flag-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 5px;
      width: auto;
      margin: 0;
    }
    .flag-btn:hover {
      color: #d9534f;
    }
    .avaliacao strong {
      color: #ffb400;
    }
    button {
      background: #006633;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #ccc;
    }
    textarea, select, input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-top: 8px;
      box-sizing: border-box;
    }
    #avaliacoes {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    .pagination-btn {
      background: #f0f0f0;
      color: #666;
      font-size: 0.8rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <section>
    <h2 id="tituloEvento">Carregando...</h2>
    <div id="mediaEstrelas" style="text-align:center;font-size:18px;color:#ffb400;margin-bottom:15px;font-weight:bold;"></div>
    <div id="avaliacoes"></div>

    <form id="novoComentario">
      <label style="font-weight: bold; font-size: 0.9rem;">Sua avaliação:</label>
      <select id="nota">
        <option value="5">⭐⭐⭐⭐⭐ Excelente</option>
        <option value="4">⭐⭐⭐⭐ Muito bom</option>
        <option value="3">⭐⭐⭐ Regular</option>
        <option value="2">⭐⭐ Ruim</option>
        <option value="1">⭐ Péssimo</option>
      </select>
      <input type="text" id="nome" placeholder="Seu nome (opcional)" />
      <textarea id="comentario" rows="3" placeholder="Escreva seu comentário..."></textarea>
      <button type="submit" id="btnEnviar">Enviar Avaliação</button>
    </form>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');
    const eventName = params.get('evento') || 'Evento';
    let currentPage = 0;
    const pageSize = 5;
      let allReviews = [];
      let lastPostTime = 0;
      const cooldownTime = 60000; // 1 minute cooldown
      
      document.getElementById('tituloEvento').innerText = `Avaliações de ${eventName}`;

    const supabaseUrl = 'https://xwuyzqahfoyhdbmtspwf.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3dXl6cWFoZm95aGRibXRzcHdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNDk0NjksImV4cCI6MjA5MTkyNTQ2OX0.QyGVMftXH7haMUPTct459-EQoFeKZ-dA3BoEE4-ZV-0';
    const supabase = supabasejs.createClient(supabaseUrl, supabaseKey);

    async function flagReview(id) {
      if (!confirm('Deseja denunciar este comentário como impróprio?')) return;
      const { error } = await supabase
        .from('event_reviews')
        .update({ is_flagged: true, status: 'pending' })
        .eq('id', id);
      
      if (error) alert('Erro ao denunciar: ' + error.message);
      else {
        alert('Comentário denunciado e enviado para moderação.');
        loadReviews(true);
      }
    }

    async function loadReviews(reset = false) {
      if (reset) {
        currentPage = 0;
        allReviews = [];
      }

      const { data: reviews, error } = await supabase
        .from('event_reviews')
        .select('*')
        .eq('event_id', eventId)
        .eq('status', 'approved')
        .order('created_at', { ascending: false })
        .range(currentPage * pageSize, (currentPage + 1) * pageSize - 1);

      if (error) {
        console.error('Erro ao carregar:', error);
        return;
      }

      const lista = document.getElementById('avaliacoes');
      const mediaEl = document.getElementById('mediaEstrelas');
      
      if (currentPage === 0) lista.innerHTML = '';
      
      reviews.forEach(a => {
        const div = document.createElement('div');
        div.className = 'avaliacao';
        div.innerHTML = `
          <button class="flag-btn" onclick="flagReview('${a.id}')" title="Denunciar">🚩</button>
          <strong>${a.rating}⭐</strong> — ${a.comment} 
          <br><small style="color:#999">— ${a.user_name || 'Anônimo'}</small>
        `;
        lista.appendChild(div);
      });

      // Update media (only on first load or reset)
      if (currentPage === 0) {
        const { data: summary } = await supabase
          .from('event_ratings_summary')
          .select('*')
          .eq('event_id', eventId)
          .single();
        
        const media = summary ? summary.average_rating : 0;
        mediaEl.innerHTML = media > 0 ? `Média: ${media}⭐` : 'Ainda não há avaliações';
        localStorage.setItem(`media_${eventName}`, media);
      }

      // Pagination button
      const existingBtn = document.getElementById('loadMoreBtn');
      if (existingBtn) existingBtn.remove();
      
      if (reviews.length === pageSize) {
        const btn = document.createElement('button');
        btn.id = 'loadMoreBtn';
        btn.className = 'pagination-btn';
        btn.innerText = 'Carregar mais comentários...';
        btn.onclick = () => {
          currentPage++;
          loadReviews();
        };
        lista.after(btn);
      }
    }

    document.getElementById('novoComentario').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btnEnviar');
      const nota = document.getElementById('nota').value;
      const comentario = document.getElementById('comentario').value;
      const nome = document.getElementById('nome').value;

      if (!comentario.trim()) {
        alert('Por favor, escreva um comentário.');
        return;
      }

      const now = Date.now();
      if (now - lastPostTime < cooldownTime) {
        const remaining = Math.ceil((cooldownTime - (now - lastPostTime)) / 1000);
        alert(`Aguarde ${remaining} segundos para postar novamente.`);
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Enviando...';

      const { data, error } = await supabase.from('event_reviews').insert([{
        event_id: eventId,
        rating: parseInt(nota),
        comment: comentario,
        user_name: nome || 'Anônimo'
      }]).select();

      if (error) {
        alert('Erro ao enviar: ' + error.message);
      } else {
        const review = data[0];
        if (review.status === 'pending') {
          alert('Avaliação enviada! Por conter termos que exigem atenção ou por ser uma nova postagem, ela passará por uma breve moderação antes de aparecer publicamente.');
        } else {
          alert('Avaliação publicada com sucesso!');
        }
        document.getElementById('comentario').value = '';
        document.getElementById('nome').value = '';
        lastPostTime = now;
        loadReviews(true);
      }
      
      btn.disabled = false;
      btn.innerText = 'Enviar Avaliação';
    });

    if (eventId) {
      loadReviews();
      // Real-time subscription
      supabase
        .channel('schema-db-changes')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'event_reviews', filter: `event_id=eq.${eventId}` }, loadReviews)
        .subscribe();
    } else {
      document.getElementById('avaliacoes').innerHTML = '<p style="text-align:center; color:red;">ID do evento não fornecido.</p>';
    }
  </script>
</body>
</html>
